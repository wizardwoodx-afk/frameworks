[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rister"
version = "1.1.0"
description = "RISTER — a unified, native toolkit for governed AI agents: graphs, agents, memory, policy, scanning, tracing and evals in one dependency-free runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RISTER" }]
keywords = ["agents", "orchestration", "governance", "security", "tracing", "evals"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Documentation = "https://example.invalid/rister"

[project.scripts]
rister = "rister.__main__:main"

[tool.setuptools.packages.find]
include = ["rister*"]

[tool.setuptools.package-data]
rister = ["py.typed"]
